<form id="dealForm" class="deal-form">
  <input type="hidden" name="id" id="dealFormId" value="" />

  <div class="form-row">
    <label for="dealBrandName">Brand name <span class="req">*</span></label>
    <input type="text" id="dealBrandName" name="brand_name" class="input-text" required maxlength="255" />
  </div>
  <div class="form-row">
    <label for="dealBrandEmail">Brand email</label>
    <input type="email" id="dealBrandEmail" name="brand_email" class="input-text" maxlength="255" />
  </div>
  <div class="form-row">
    <label for="dealTitle">Deal title <span class="req">*</span></label>
    <input type="text" id="dealTitle" name="title" class="input-text" required maxlength="255" />
  </div>
  <div class="form-row form-row--2">
    <div>
      <label for="dealType">Deal type</label>
      <select id="dealType" name="deal_type" class="input-select">
        <option value="sponsored_post">Sponsored post</option>
        <option value="affiliate">Affiliate</option>
        <option value="ambassador">Ambassador</option>
        <option value="gifted">Gifted</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div>
      <label for="dealStatus">Status</label>
      <select id="dealStatus" name="status" class="input-select">
        <option value="lead">Lead</option>
        <option value="negotiation">Negotiation</option>
        <option value="contract">Contract</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
  </div>
  <div class="form-row form-row--2">
    <div>
      <label for="dealAmount">Amount <span class="req">*</span></label>
      <input type="number" id="dealAmount" name="amount" class="input-text" required min="0" step="0.01" />
    </div>
    <div>
      <label for="dealCurrency">Currency</label>
      <select id="dealCurrency" name="currency" class="input-select">
        <option value="TZS">TZS</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <label for="dealDeadline">Deadline</label>
    <input type="date" id="dealDeadline" name="deadline_at" class="input-date" />
  </div>
  <div class="form-row">
    <label for="dealDescription">Description</label>
    <textarea id="dealDescription" name="description" class="input-textarea" rows="3"></textarea>
  </div>
  <div class="form-row">
    <label for="dealDeliverables">Deliverables</label>
    <textarea id="dealDeliverables" name="deliverables" class="input-textarea" rows="3" placeholder="What you owe the brand"></textarea>
  </div>
  <div class="form-row">
    <label for="dealNotes">Notes</label>
    <textarea id="dealNotes" name="notes" class="input-textarea" rows="2"></textarea>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary" id="dealFormSubmit">Save deal</button>
  </div>
</form>
