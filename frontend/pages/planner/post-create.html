<div class="composer-mobile-toggle" id="composerMobileToggle" role="tablist" aria-label="Composer view">
  <button type="button" class="composer-mobile-tab active" data-panel="form" role="tab" aria-selected="true">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125" /></svg>
    Edit
  </button>
  <button type="button" class="composer-mobile-tab" data-panel="preview" role="tab" aria-selected="false">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
    Preview
  </button>
</div>

<div class="composer-split" id="composerSplit">

  <!-- ── Left: Compose form ─────────────────────────────── -->
  <div class="composer-form-panel" id="composerFormPanel">
    <form id="postComposerForm" class="post-composer" autocomplete="off">
      <input type="hidden" id="pmPostId" value="">

      <!-- Title -->
      <div class="composer-field">
        <label class="composer-label" for="pmTitle">Title</label>
        <input type="text" class="composer-input" id="pmTitle" required maxlength="255" placeholder="Post title…">
      </div>

      <!-- Content / Body -->
      <div class="composer-field">
        <div class="composer-label-row">
          <label class="composer-label" for="pmContent">Post text</label>
          <span class="char-counter" id="pmCharContent">0</span>
        </div>
        <textarea class="composer-textarea" id="pmContent" rows="5" maxlength="5000" placeholder="Write your post…"></textarea>
        <div class="platform-char-warnings" id="pmPlatformCharWarnings"></div>
      </div>

      <!-- Caption / Hashtags -->
      <div class="composer-field">
        <div class="composer-label-row">
          <label class="composer-label" for="pmCaption">Caption &amp; hashtags <span class="composer-label-hint">(overrides post text on platforms)</span></label>
          <span class="char-counter" id="pmCharCaption">0 / 2200</span>
        </div>
        <textarea class="composer-textarea composer-textarea--short" id="pmCaption" rows="3" maxlength="2200" placeholder="#hashtag1 #hashtag2…"></textarea>
      </div>

      <!-- Platforms -->
      <div class="composer-field">
        <span class="composer-label">Publish to</span>
        <div class="platform-cards-v2" id="pmPlatformCards">
          <label class="platform-card-v2">
            <input type="checkbox" name="pm_platform" value="instagram">
            <span class="platform-card-inner">
              <svg class="pci-icon pci-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
              Instagram
            </span>
          </label>
          <label class="platform-card-v2">
            <input type="checkbox" name="pm_platform" value="facebook">
            <span class="platform-card-inner">
              <svg class="pci-icon pci-facebook" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
              Facebook
            </span>
          </label>
          <label class="platform-card-v2">
            <input type="checkbox" name="pm_platform" value="twitter">
            <span class="platform-card-inner">
              <svg class="pci-icon pci-twitter" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              X / Twitter
            </span>
          </label>
          <label class="platform-card-v2">
            <input type="checkbox" name="pm_platform" value="tiktok">
            <span class="platform-card-inner">
              <svg class="pci-icon pci-tiktok" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.81a8.18 8.18 0 004.78 1.52V6.89a4.85 4.85 0 01-1.01-.2z"/></svg>
              TikTok
            </span>
          </label>
          <label class="platform-card-v2">
            <input type="checkbox" name="pm_platform" value="youtube">
            <span class="platform-card-inner">
              <svg class="pci-icon pci-youtube" viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 001.46 6.42 29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.4a2.78 2.78 0 001.95-1.97A29 29 0 0023 12a29 29 0 00-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="white"/></svg>
              YouTube
            </span>
          </label>
        </div>
      </div>

      <!-- Media -->
      <div class="composer-field">
        <span class="composer-label">Media</span>
        <div class="media-dropzone-v2" id="pmDropzone" tabindex="0" role="button" aria-label="Upload media">
          <div class="dropzone-icon-wrap">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <p class="dropzone-text">Drop files here or <button type="button" class="btn-inline-link" id="pmBrowse">browse</button></p>
          <p class="dropzone-hint">Images &amp; video · up to 10 MB each</p>
          <input type="file" id="pmFileInput" accept="image/*,video/mp4,video/webm" multiple hidden>
        </div>
        <div class="media-preview-grid-v2" id="pmMediaPreview"></div>
        <button type="button" class="btn btn-ghost btn-sm composer-lib-btn" id="pmPickLibrary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          Media library
        </button>
      </div>

      <!-- Tags -->
      <div class="composer-field">
        <span class="composer-label">Tags</span>
        <div class="tag-input-row-v2">
          <input type="text" class="composer-input" id="pmTagSearch" list="pmTagList" placeholder="Search tags…" autocomplete="off">
          <datalist id="pmTagList"></datalist>
          <button type="button" class="btn btn-secondary btn-sm" id="pmTagCreate">+ New</button>
        </div>
        <div class="tag-chips" id="pmTagChips"></div>
      </div>

      <!-- Status -->
      <div class="composer-field">
        <span class="composer-label">Publish mode</span>
        <div class="status-toggle-row">
          <label class="status-toggle-opt">
            <input type="radio" name="pm_status" value="draft" checked>
            <span class="status-toggle-lbl">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Save as draft
            </span>
          </label>
          <label class="status-toggle-opt">
            <input type="radio" name="pm_status" value="now">
            <span class="status-toggle-lbl">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              Post now
            </span>
          </label>
          <label class="status-toggle-opt">
            <input type="radio" name="pm_status" value="scheduled">
            <span class="status-toggle-lbl">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Schedule
            </span>
          </label>
        </div>
      </div>

      <!-- Schedule date/time -->
      <div class="composer-field" id="pmScheduleRow" style="display:none">
        <label class="composer-label" for="pmScheduledAt">Publish at</label>
        <input type="datetime-local" class="composer-input" id="pmScheduledAt">
      </div>

    </form>
  </div>

  <!-- ── Right: Live preview ────────────────────────────── -->
  <div class="composer-preview-panel" id="composerPreviewPanel">
    <div class="preview-header">
      <span class="preview-header-label">Preview</span>
      <div class="preview-platform-tabs" id="previewPlatformTabs">
        <button type="button" class="preview-tab active" data-preview-platform="instagram" title="Instagram">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          IG
        </button>
        <button type="button" class="preview-tab" data-preview-platform="facebook" title="Facebook">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
          FB
        </button>
        <button type="button" class="preview-tab" data-preview-platform="twitter" title="X / Twitter">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X
        </button>
        <button type="button" class="preview-tab" data-preview-platform="tiktok" title="TikTok">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.81a8.18 8.18 0 004.78 1.52V6.89a4.85 4.85 0 01-1.01-.2z"/></svg>
          TT
        </button>
        <button type="button" class="preview-tab" data-preview-platform="youtube" title="YouTube">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 001.46 6.42 29 29 0 001 12a29 29 0 00.46 5.58A2.78 2.78 0 003.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.4a2.78 2.78 0 001.95-1.97A29 29 0 0023 12a29 29 0 00-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="white"/></svg>
          YT
        </button>
      </div>
    </div>
    <div class="preview-scroll">
      <div id="previewContent" class="preview-content"></div>
      <div class="preview-char-info" id="previewCharInfo"></div>
    </div>
  </div>

</div>
